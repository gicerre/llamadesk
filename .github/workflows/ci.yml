name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Nessun job di verifica scrive nel repository: il token resta in sola lettura
# anche quando la CI gira su un push, non solo sulle pull request dai fork.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build:vite

      # Valida ogni query SQL del backend contro lo schema reale: gira anche
      # senza toolchain Rust, e fallisce prima che l'errore arrivi all'utente.
      - run: npm run check:sql

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
      # `cargo test` rigenera i tipi TypeScript: se cambiano, qualcuno ha
      # modificato `domain` senza committare i tipi aggiornati.
      - name: Generated types are committed
        run: git diff --exit-code -- src/types/generated

  # Guardia sulla promessa "zero telemetria": nessun client HTTP puo' entrare
  # nell'albero delle dipendenze Rust senza che questo job fallisca.
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No network crates
        run: |
          if grep -Eiq '^(reqwest|ureq|hyper|isahc|surf|curl|attohttpc)\b' src-tauri/Cargo.toml; then
            echo "::error::Trovata una dipendenza di rete in src-tauri/Cargo.toml"
            exit 1
          fi
          echo "Nessun client HTTP dichiarato."
