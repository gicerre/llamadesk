[package]
name = "llamadesk"
version = "0.1.0"
description = "Local-first launcher and workspace manager for links, tools and project contexts"
authors = ["LlamaDesk contributors"]
license = "MIT"
repository = "https://github.com/USERNAME/LlamaDesk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "llamadesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# SQLite compilato dentro l'eseguibile: zero DLL, zero installazioni sul PC finale.
rusqlite = { version = "0.32", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"
url = "2"
sys-locale = "0.3"

# Genera i tipi TypeScript di `src/types/generated` dalle struct di `domain`
# (con `cargo test`): Rust e React non possono piu' divergere. Solo macro e
# generazione di file, nessun effetto a runtime.
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }

# NOTA DI PRIVACY: qui dentro non esiste, e non deve mai esistere, un client
# HTTP (reqwest, ureq, ...). Il Cargo.lock e' la prova verificabile che
# LlamaDesk non puo' effettuare alcuna chiamata di rete.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
